<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', system-ui, sans-serif; background: transparent; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
.container { max-width: 480px; width: 100%; display: flex; flex-direction: column; gap: 2px; position: relative; }
.block { border-radius: 12px; padding: 16px 20px; opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; position: relative; }
.block.visible { opacity: 1; transform: translateY(0); }
.block .title { font-size: 15px; font-weight: 800; color: #fff; letter-spacing: -0.01em; }
.block .sub { font-size: 11px; color: rgba(255,255,255,0.75); margin-top: 2px; font-weight: 500; }
.block-apps { background: #8B4513; }
.block-distro { background: #483D8B; }
.block-kernel { background: #006400; }
.block-hw { background: #4F4F4F; }
.arrow { text-align: center; font-size: 14px; color: #6B7280; opacity: 0; transition: opacity 0.4s ease; padding: 2px 0; }
.arrow.visible { opacity: 1; }
.arrow .line { display: inline-block; animation: pulseArrow 1.5s ease-in-out infinite; }
@keyframes pulseArrow { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
.note { position: absolute; right: -140px; top: 50%; transform: translateY(-50%); font-size: 10px; color: #9CA3AF; font-weight: 600; opacity: 0; transition: opacity 0.8s ease 2.5s; width: 130px; line-height: 1.4; }
.note.visible { opacity: 1; }
.note .dot-line { position: absolute; left: -20px; top: 50%; width: 15px; height: 0; border-top: 1.5px dashed #6B7280; animation: blinkNote 2s ease-in-out infinite; }
@keyframes blinkNote { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
@media (max-width: 600px) { .note { position: static; transform: none; margin-top: 8px; width: auto; } .note .dot-line { display: none; } }
</style>
</head>
<body>
<div class="container">
  <div class="block block-apps" id="b1"><div class="title">Programas</div><div class="sub">Navegador, jogos, scripts</div></div>
  <div class="arrow" id="a1"><span class="line">⇅</span></div>
  <div class="block block-distro" id="b2"><div class="title">Distro (GNU/Linux)</div><div class="sub">Ferramentas GNU, gestor de pacotes</div></div>
  <div class="arrow" id="a2"><span class="line">⇅</span></div>
  <div class="block block-kernel" id="b3" style="position:relative;"><div class="title">Kernel Linux</div><div class="sub">Gerencia processos, memória, drivers</div><div class="note" id="note"><span class="dot-line"></span>fala direto com o hardware</div></div>
  <div class="arrow" id="a3"><span class="line">⇅</span></div>
  <div class="block block-hw" id="b4"><div class="title">Hardware</div><div class="sub">Processador, memória, disco</div></div>
</div>
<script>
const blocks = ['b1','b2','b3','b4'];
const arrows = ['a1','a2','a3'];
blocks.forEach((id, i) => { setTimeout(() => document.getElementById(id).classList.add('visible'), 300 + i * 400); });
arrows.forEach((id, i) => { setTimeout(() => document.getElementById(id).classList.add('visible'), 700 + i * 400); });
setTimeout(() => document.getElementById('note').classList.add('visible'), 2500);
if (new URLSearchParams(window.location.search).get('dark') === '1') { document.documentElement.classList.add('dark'); }
</script>
</body>
</html>
